name: Checks

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  workflow_dispatch:
    inputs:
      release:
        description: Validate a prepared stable release
        type: boolean
        default: false
      base:
        description: Ancestor commit or ref for the change boundary
        type: string
        default: HEAD^
        required: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Run contract checks
        run: python -m unittest discover -s tests -v
      - name: Validate sources without changing retained release artifacts
        run: python src/generate.py --validate
      - name: Check source catalogue freshness and release ownership
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          RELEASE_PR: ${{ contains(github.event.pull_request.labels.*.name, 'release') }}
          MANUAL_RELEASE: ${{ inputs.release }}
          MANUAL_BASE: ${{ inputs.base }}
        run: |
          args=()
          if [ "$EVENT_NAME" = pull_request ]; then
            base="$PR_BASE"
            if [ "$RELEASE_PR" = true ]; then args+=(--release); fi
          elif [ "$EVENT_NAME" = push ]; then
            base="$PUSH_BASE"
            if ! git diff --quiet "$base" HEAD -- VERSION; then args+=(--release); fi
          else
            base="$MANUAL_BASE"
            if [ "$MANUAL_RELEASE" = true ]; then args+=(--release); fi
          fi
          python src/check_changes.py --base "$base" "${args[@]}"
      - name: Build isolated unreleased review preview
        run: python src/generate.py --preview "$RUNNER_TEMP/expert-roles-preview"
      - name: Check preview links, images and anchors
        run: python src/check_docs.py --root "$RUNNER_TEMP/expert-roles-preview"
      - name: Attach review preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: expert-roles-preview
          path: ${{ runner.temp }}/expert-roles-preview/
          include-hidden-files: true # The curated preview includes its public .github links.
          if-no-files-found: error
          retention-days: 7
